<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Tracker | Voltas CR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --voltas-blue: #0056b3; }
        body { background-color: #f0f2f5; }
        .header-section { background: var(--voltas-blue); color: white; padding: 20px 0; border-radius: 0 0 20px 20px; }
        .form-card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-log { background: var(--voltas-blue); border: none; padding: 15px; font-weight: 600; font-size: 1.1rem; }
        .history-badge { background: #e9ecef; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="header-section text-center mb-4">
    <h1 class="h3 fw-bold mb-1">Slitting Tracker</h1>
    <p class="mb-0 opacity-75">Production Dept. - Waghodia Plant</p>
</div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card form-card p-4 mb-4">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase text-muted">Coil Width (mm)</label>
                    <input type="number" id="width" class="form-control form-control-lg bg-light" placeholder="e.g., 776">
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase text-muted">CTL Size Output</label>
                    <select id="size" class="form-select form-select-lg bg-light">
                        <option value="767*1283">767 * 1283 mm</option>
                        <option value="800*1500">800 * 1500 mm</option>
                        <option value="Custom">Custom / Other</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase text-muted">Total Quantity</label>
                    <input type="number" id="qty" class="form-control form-control-lg bg-light" value="1">
                </div>

                <button onclick="submitData()" id="submitBtn" class="btn btn-primary btn-log w-100 shadow">
                    LOG DATA TO FIREBASE
                </button>
            </div>

            <h6 class="fw-bold text-muted text-uppercase mb-3">Recent Logs</h6>
            <div id="historyList">
                <p class="text-muted small">No logs yet in this session.</p>
            </div>
        </div>
    </div>
</div>

<script>
    async function submitData() {
        const btn = document.getElementById('submitBtn');
        const width = document.getElementById('width').value;
        const size = document.getElementById('size').value;
        const qty = document.getElementById('qty').value;

        if(!width || !qty) return alert("Please fill all fields");

        btn.disabled = true;
        btn.innerText = "SAVING...";

        const data = {
            width: width,
            size: size,
            qty: qty,
            timestamp: new Date().toLocaleString()
        };

        try {
            const res = await fetch('/log_production', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if(res.ok) {
                addToHistory(data);
                document.getElementById('width').value = "";
                alert("Success! Data recorded.");
            }
        } catch(e) {
            alert("Connection error. Check database.");
        } finally {
            btn.disabled = false;
            btn.innerText = "LOG DATA TO FIREBASE";
        }
    }

    function addToHistory(item) {
        const list = document.getElementById('historyList');
        if(list.innerText.includes("No logs")) list.innerHTML = "";
        
        const div = document.createElement('div');
        div.className = "history-badge d-flex justify-content-between align-items-center";
        div.innerHTML = `
            <div>
                <strong>${item.width}mm</strong> &rarr; ${item.size}<br>
                <small class="text-muted">${item.timestamp}</small>
            </div>
            <span class="badge bg-success rounded-pill">Qty: ${item.qty}</span>
        `;
        list.prepend(div);
    }
</script>
</body>
</html>
