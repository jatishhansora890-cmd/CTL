<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltas Production Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #0056b3; border: none; padding: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Voltas CR Plant</h2>
            <p class="text-muted">Slitting Production Tracker</p>
        </div>

        <div class="card p-4 mb-4">
            <label class="form-label fw-bold">1. Coil Width (mm)</label>
            <input type="number" id="width" class="form-control form-control-lg" placeholder="e.g. 776">
            
            <label class="form-label fw-bold mt-3">2. CTL Size</label>
            <select id="size" class="form-select form-select-lg">
                <option>767*1283</option>
                <option>800*1500</option>
            </select>

            <label class="form-label fw-bold mt-3">3. Quantity</label>
            <input type="number" id="qty" class="form-control form-control-lg" value="1">

            <button onclick="submitData()" class="btn btn-primary w-100 mt-4 shadow-sm">LOG PRODUCTION</button>
        </div>
        
        <div id="status" class="text-center fw-bold text-success"></div>
    </div>

    <script>
        async function submitData() {
            const data = {
                width: document.getElementById('width').value,
                size: document.getElementById('size').value,
                qty: document.getElementById('qty').value,
                timestamp: new Date().toISOString()
            };
            const response = await fetch('/log_production', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(response.ok) {
                document.getElementById('status').innerText = "✅ Successfully Logged!";
                setTimeout(() => document.getElementById('status').innerText = "", 3000);
            }
        }
    </script>
</body>
</html>
